# AP-29 validation event set (Phase 2a): matched escalation/control pairs for validation
# against real events, instead of relying on many fixtures. Each entry references an AP-27
# reference case_id; per-case window/onset/trajectory/reference_sources are derived from that
# label entry (validation_reference_cases.yaml) -- not duplicated here.
#
# Curation v2 (2026-06-26): expanded from v1 (3 pairs) to 8 matched pairs of REAL events, each
# onset and each control's in-window quietness source-verified by online research (see the per-case
# source notes in validation_reference_cases.yaml). Controls are period-matched stable comparators.
# Every referenced case carries ratification_status: research_verified -- the research backs the
# ratification, but the FINAL ratification against primary sources (and any further extension)
# remains owner authority. The consistency test (test_validation_cases.py) enforces that every pair
# stays consistent with the AP-27 label library (existing case, escalation positive, control S0
# negative, assigned_sources subset of reference_sources).
metadata:
  artifact: validation_event_set
  governance: owner_authority
  target_size: "balanced matched escalation/control pairs (expandable)"
  references: vmodel/verification/validation_reference_cases.yaml
  curation_version: v3
  curated_pairs: 8
  ratification_status: research_verified
  split_design: >-
    Stratified pair-level split (AP-34.5, SwR-112): tuning = PAIR-UKR-CHE, PAIR-SDN-GHA,
    PAIR-MMR-CRI, PAIR-SYR-JPN; holdout = PAIR-ISR-OMN, PAIR-AZE-NOR, PAIR-NER-BWA,
    PAIR-AFG-URY. Pairs travel together; both splits contain both classes plus regional
    and case-type diversity. Replaces the v2 assignment (all positives tuning / all
    negatives holdout), under which a holdout evaluation would have had zero positives
    and calibration zero controls. v3 also adds observation_basis to every onset-dated
    positive (AP-34.4, SwR-111): the documented, label-independent path by which
    historical_observed_status was determined.
event_pairs:
  - pair_id: PAIR-UKR-CHE-001
    rationale: "E.Europe interstate invasion (onset 2022-02-24) matched with a stable European quiet quarter."
    escalation:
      case_id: VAL-UKR-2022-001
      assigned_sources: [SRC-GDELT-DOC, SRC-GDELT-EVENTS, SRC-GDACS, WB-INDICATORS]
    control:
      case_id: VAL-CHE-2024-NEGATIVE-001
      assigned_sources: [SRC-GDELT-DOC, SRC-GDELT-EVENTS, SRC-GDACS, WB-INDICATORS]
