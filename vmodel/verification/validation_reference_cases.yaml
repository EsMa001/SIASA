    time_start: "2024-05-01"
    time_end: "2024-05-31"
    expected_domains: [A, B]
    expected_signal_pattern: Information and event pressure should be visible even where the governed pilot intentionally excludes live Domain D support.
    reference_sources: [SRC-GDELT-DOC, SRC-GDELT-EVENTS, SRC-GDACS]
    validation_goal: Preserve an explicit A/B-only reference case for TWN under the current governed pilot scope.
    known_limitations:
      - governed live runtime intentionally scopes TWN to A/B and does not claim historical Domain D support
