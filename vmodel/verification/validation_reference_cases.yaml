validation_cases:
  - case_id: VAL-UKR-2022-001
    country_id: UKR
    case_name: Escalation reference case
    case_type: military_escalation
    time_start: "2022-02-01"
    time_end: "2022-03-01"
    expected_domains: [A, B, D]
    expected_signal_pattern: Aligned information, event, and economic stress escalation.
    reference_sources: [SRC-GDELT-DOC, SRC-GDELT-EVENTS, WB-INDICATORS]
    validation_goal: Check multi-domain alignment detection for the initial full-scale escalation window.
    known_limitations:
      - historical macro backfill still thinner than the full stakeholder target horizon
    validation_metrics: [Domain Match, Status Match]

  - case_id: VAL-POL-2023-001
    country_id: POL
    case_name: Hybrid pressure reference case
    case_type: hybrid_pressure
    time_start: "2023-10-01"
    time_end: "2023-10-31"
    expected_domains: [A, B, D]
    expected_signal_pattern: Border-pressure and security spillover should create aligned information, event, and economic stress signals.
    reference_sources: [SRC-GDELT-DOC, SRC-GDELT-EVENTS, SRC-GDACS, WB-INDICATORS]
    validation_goal: Check that a pressured NATO-east flank case remains representable across A/B/D.
    known_limitations:
      - conflict/disaster windows can still be sparse in some daily live exports
    validation_metrics: [Domain Match, Status Match]

  - case_id: VAL-ISR-2023-001
    country_id: ISR
    case_name: Regional conflict pressure reference case
    case_type: strategic_posturing
    time_start: "2023-10-07"
    time_end: "2023-11-07"
    expected_domains: [A, B, D]
    expected_signal_pattern: Regional conflict escalation should align information pressure, event intensity, and macro stress context.
    reference_sources: [SRC-GDELT-DOC, SRC-GDELT-EVENTS, SRC-GDACS, WB-INDICATORS]
    validation_goal: Keep a clearly reviewable A/B/D reference case for regional-conflict escalation.
    known_limitations:
