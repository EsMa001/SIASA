metadata:
  project: SIASA
  artifact_type: stakeholder_verification_coverage_policy
  work_package: AP-03
  purpose: >-
    Define acceptable verification routes for AP-03 after AP-01 quality normalization
    and AP-02 stakeholder-to-system traceability closure.
  decision_model: 5.5-class high-level review per docs/verification/siasa-model-routing-matrix.md
  execution_model: Codex 5.3 for repository artifact updates
verification_route_types:
  software_route:
    description: >-
      System requirement requires software-level realization. AP-03 expects at least one
      derived SwR and at least one verifying TC for every derived SwR, plus a system-level TC.
    applies_to: SyR-001..030
  governance_system_route:
    description: >-
      System requirement is a governance, boundary, role, risk, ethics, quality, or
      acceptance-control requirement. It is verified at system level by TC-SyR and does
      not require a new SwR unless AP-04/AP-05 implementation flow design identifies
      concrete missing product behavior.
    applies_to: SyR-031..050
