ap03_stop_criteria:
  - id: AP03-VC-001
    accepted_when: every active StR has at least one SyR and at least one system-level TC through that SyR
  - id: AP03-VC-002
    accepted_when: every SyR is assigned exactly one verification route type
  - id: AP03-VC-003
    accepted_when: every software_route SyR has at least one derived SwR
  - id: AP03-VC-004
    accepted_when: every accepted SwR has at least one verifying TC-SwR
  - id: AP03-VC-005
    accepted_when: every governance_system_route SyR has at least one verifying TC-SyR and is explicitly marked as not requiring new SwR in AP-03
closure_boundary: >-
  AP-03 closes verification specification coverage. It proves every stakeholder requirement
  has a governed verification route. It does not claim every stakeholder-facing end-to-end
  flow has been executed; AP-04 covers flow-level E2E execution evidence.