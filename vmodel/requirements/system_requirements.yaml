system_requirements:
- id: SyR-001
  title: Country-centric multi-domain analytical system
  category: Mission and scope
  statement: The system shall provide a country-centric analytical capability for structured assessment of information and activity spaces under uncertainty.
  status: accepted
  derives_from:
  - StR-001
  - StR-004
  - StR-024
  - StR-025
  acceptance_criteria_refs:
  - AC-009
  verification_method: system_review_and_demo
- id: SyR-002
  title: Explicit domain separation A-E
  category: Mission and scope
  statement: The system shall separate the analytical domains A information space, B event data, C physical activity, D economic/structural data, and E cyber/tech/info-ops as distinct system domains.
  status: accepted
  derives_from:
  - StR-002
  - StR-008
  - StR-009
  - StR-010
  - StR-011
  - StR-012
  acceptance_criteria_refs:
  - AC-005
  - AC-006
  verification_method: system_inspection_and_rule_test
- id: SyR-003
  title: No deterministic prediction and no naive overall score
  category: Mission and scope
  statement: The system shall not produce deterministic event predictions or a naive additive cross-domain instability score across domains A-E in the MVP baseline.
  status: accepted
  derives_from:
