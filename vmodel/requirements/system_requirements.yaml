- id: SyR-009
  title: Daily incremental run orchestration
  category: Operations and runs
  statement: The system shall execute daily incremental runs that acquire new data, persist raw records, normalize inputs, compute features, derive status values, and store a versioned snapshot.
  status: accepted
  derives_from:
  - StR-143
  - StR-144
  - StR-145
  - StR-146
  - StR-147
  - StR-481
  - StR-482
  - StR-483
