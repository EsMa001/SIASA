- id: SyR-051
  title: Permanent data archive with ML-optimized storage
  category: Data lifecycle
  statement: The system shall permanently archive all normalized records in a columnar, ML-optimized format (Parquet) with Hive-partitioning by source, year, and month, dual timestamps (event time, ingestion time, period start/end, granularity), and an embedded analytical query engine (DuckDB) for efficient time-window slicing and zero-copy Arrow output.
