metadata:
  project: SIASA
  derived_from: Imported stakeholder workbook baseline
  source_requirements_file: vmodel/requirements/stakeholder_requirements.yaml
  status: draft_baseline_derived
  notes:
  - System requirements were derived from the imported stakeholder baseline, acceptance criteria, domain model, run strategy, governance principles, and system boundaries.
  - This file establishes the first canonical system layer for SIASA.
  reviewed_for_next_vmodel_step_at_utc: '2026-05-11T14:25:30.979384+00:00'
  review_note: Reviewed as derivation baseline for software requirements. Duplicate source references removed where present.
system_requirements:
- id: SyR-001
  title: Country-centric multi-domain analytical system
  category: Mission and scope
  statement: The system shall provide a country-centric analytical capability for structured assessment of information and activity spaces under uncertainty.
  status: accepted
  derives_from:
  - StR-001
  - StR-004
  - StR-024
  - StR-025
  acceptance_criteria_refs:
  - AC-009
  verification_method: system_review_and_demo
- id: SyR-002
  title: Explicit domain separation A-E
  category: Mission and scope
  statement: The system shall separate the analytical domains A information space, B event data, C physical activity, D economic/structural data, and E cyber/tech/info-ops as distinct system domains.
  status: accepted
  derives_from:
  - StR-002
  - StR-008
  - StR-009
  - StR-010
  - StR-011
  - StR-012
  acceptance_criteria_refs:
  - AC-005
  - AC-006
  verification_method: system_inspection_and_rule_test
- id: SyR-003
  title: No deterministic prediction and no naive overall score
  category: Mission and scope
  statement: The system shall not produce deterministic event predictions or a naive additive cross-domain instability score across domains A-E in the MVP baseline.
  status: accepted
  derives_from:
  - StR-007
  - StR-226
  - StR-227
  - StR-228
  - StR-229
  - StR-230
  acceptance_criteria_refs:
  - AC-007
  - AC-018
  verification_method: architecture_review_and_gui_report_review
- id: SyR-004
  title: Versioned MVP country set with priorities
  category: Scope configuration
  statement: The system shall manage a versioned MVP country set with ISO code, region, selection type, priority class P1/P2/P3, and selection rationale per country.
  status: accepted
  derives_from:
  - StR-162
  - StR-163
  - StR-164
  - StR-165
  - StR-166
  - StR-167
  - StR-168
  - StR-169
  - StR-170
  - StR-171
  acceptance_criteria_refs:
  - AC-001
  verification_method: configuration_review
- id: SyR-005
  title: Variable integration depth by country priority
  category: Scope configuration
  statement: The system shall support variable integration depth by country priority so that P1 countries can use deeper multi-domain coverage than P2 and P3 countries.
  status: accepted
  derives_from:
  - StR-172
  - StR-173
  - StR-174
  - StR-175
  - StR-176
  - StR-177
  - StR-178
  acceptance_criteria_refs:
  - AC-001
  verification_method: configuration_review_and_system_inspection
- id: SyR-006
  title: Structured source catalog
  category: Source management
  statement: The system shall maintain a structured source catalog with domain assignment, access mode, history horizon, status, and governance-relevant source metadata.
  status: accepted
  derives_from:
  - StR-013
  - StR-014
  - StR-015
  - StR-016
  - StR-017
  acceptance_criteria_refs:
  - AC-011
  - AC-017
  verification_method: catalog_review
- id: SyR-007
  title: Support core and selective source families
  category: Source management
  statement: The system shall support core source integration for domains A, B, and D and selective or prepared integration for domains C and E according to source status and data sufficiency.
  status: accepted
  derives_from:
  - StR-008
  - StR-009
  - StR-010
  - StR-011
  - StR-012
  - StR-179
  - StR-180
  - StR-181
  acceptance_criteria_refs:
  - AC-002
  - AC-011
  verification_method: source_catalog_review_and_system_demo
- id: SyR-008
  title: Historical data foundation
  category: Data lifecycle
  statement: The system shall build and maintain a historical data foundation of at least three years for core sources where source availability permits and shall document shorter horizons explicitly.
  status: accepted
  derives_from:
  - StR-135
  - StR-136
  - StR-137
  - StR-138
  - StR-139
  - StR-140
  - StR-141
  - StR-142
