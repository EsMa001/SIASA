- id: SyR-010
  title: Partial-success behavior on source failures
  category: Operations and runs
  statement: The system shall tolerate individual source failures without uncontrolled run abortion and shall mark runs, snapshots, logs, and user-facing views with partial-success and failed-source information.
  status: accepted
