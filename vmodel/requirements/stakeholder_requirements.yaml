- id: StR-686
  title: Das Skill-Mass soll Vorlaufzeit und Brier-Score messen
  category: Validierung & Backtesting
  statement: Das Skill-Mass soll die Vorlaufzeit vor dem Onset (aus der taeglichen Replay-Statuszeitreihe) sowie einen Brier-Score auf die probabilistische Fall-Vorhersage messen.
