  title: Jeder Positivfall soll ein Onset-Datum und eine erwartete Trajektorie tragen
  category: Validierung & Backtesting
  statement: Jeder Positiv-Validierungsfall soll ein Onset-Datum und eine erwartete Vor/Nach-Trajektorie tragen, als Voraussetzung fuer die Vorlaufzeit-Messung.
