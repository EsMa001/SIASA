  category: Validierung & Backtesting
  statement: Das Validierungs-Labelset soll Tuning- und Holdout-Faelle disjunkt markieren und zirkulaere Labels vermeiden (historical_observed_status nicht mechanisch gleich expected_status), um Phase-4-Ueberanpassung zu verhindern.
