  title: Das Skill-Mass soll eine triviale No-Skill-Baseline schlagen
  category: Validierung & Backtesting
  statement: Das Skill-Mass soll gegen eine triviale No-Skill-Baseline (immer S3) antreten und nachweisen, dass es mehr misst als die reine Status-Trefferquote, indem es die Baseline auf Fehlalarmrate und Vorlaufzeit schlaegt; ein bewusst verschlechtertes Modell soll den Skill-Score messbar senken.
