- id: StR-682
  title: Das Validierungs-Labelset soll S0-Negativfaelle enthalten, damit Fehlalarme messbar werden
  category: Validierung & Backtesting
  statement: Das Validierungs-Labelset soll ruhige Laender/Fenster mit erwartetem S0 als Negativfaelle enthalten, damit die Fehlalarmrate ueberhaupt messbar wird.
