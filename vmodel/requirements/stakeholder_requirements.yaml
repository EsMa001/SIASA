  title: Das Skill-Mass soll Fehlalarme als eigene Kategorie ausweisen
  category: Validierung & Backtesting
  statement: Das Skill-Mass soll jeden Validierungsfall als Treffer/Verfehlt/Fehlalarm klassifizieren und eine Fehlalarmrate ausweisen, die ausschliesslich auf den S0-Negativfaellen definiert ist.
