software_requirements:
- id: SwR-001
  title: Source catalog record schema
  statement: The software shall persist source catalog records with source_id, domain, status, access mode, license or usage constraint, history horizon, update cadence, and governance notes.
  status: accepted
  derives_from:
  - SyR-006
  allocated_to_design:
  - DDS-001
  verification_method: software_specification_review
- id: SwR-002
  title: Versioned country-set schema
  statement: The software shall persist versioned country-set records with ISO code, region, selection type, priority class, and selection rationale.
  status: accepted
  derives_from:
  - SyR-004
  - SyR-005
  allocated_to_design:
  - DDS-001
  verification_method: software_specification_review
- id: SwR-003
  title: Configuration table loader
  statement: The software shall load versioned configuration tables for current windows, baseline modes, domain activation, and rule parameters from governed configuration artifacts.
  status: accepted
  derives_from:
  - SyR-013
  - SyR-030
  allocated_to_design:
  - DDS-001
  verification_method: software_specification_review
- id: SwR-004
  title: Source adapter interface
  statement: The software shall provide a reusable adapter interface for heterogeneous sources including fetch, health, and fetch-metadata reporting operations.
  status: accepted
  derives_from:
  - SyR-007
  - SyR-009
  allocated_to_design:
  - DDS-002
  verification_method: software_specification_review
- id: SwR-005
  title: Per-source failure isolation
  statement: The software shall isolate source-adapter failures so that failure of one source does not abort unrelated source processing inside the same run.
  status: accepted
  derives_from:
  - SyR-010
  allocated_to_design:
  - DDS-002
  - DDS-012
  verification_method: software_specification_review
- id: SwR-006
  title: Fetch metadata persistence
  statement: The software shall persist source fetch metadata including fetch timestamp, execution status, and source-specific diagnostics for every adapter execution.
  status: accepted
  derives_from:
  - SyR-009
  - SyR-010
  allocated_to_design:
  - DDS-002
  - DDS-007
  verification_method: software_specification_review
- id: SwR-007
  title: Raw record persistence model
  statement: The software shall persist raw source records or stable raw references with source identity and fetch timestamp needed for reproducibility.
  status: accepted
  derives_from:
  - SyR-011
  - SyR-018
  allocated_to_design:
  - DDS-003
  verification_method: software_specification_review
- id: SwR-008
  title: Permitted raw storage policy hooks
  statement: The software shall support reference-only storage or restricted payload persistence where source governance or license constraints require it.
  status: accepted
  derives_from:
  - SyR-011
  - SyR-027
  allocated_to_design:
  - DDS-003
  - DDS-011
  verification_method: software_specification_review
- id: SwR-009
  title: Normalized analytical record schema
  statement: The software shall transform ingested data into a normalized internal schema containing country, timestamp or period, domain, signal fields, provenance, and quality context.
  status: accepted
  derives_from:
  - SyR-011
  - SyR-019
  allocated_to_design:
  - DDS-003
  verification_method: software_specification_review
- id: SwR-010
  title: Normalization mapping versioning
  statement: The software shall version normalization mappings so that snapshot results can be associated with the mapping rules used at run time.
  status: accepted
  derives_from:
  - SyR-018
  - SyR-030
  allocated_to_design:
  - DDS-003
  - DDS-012
  verification_method: software_specification_review
- id: SwR-011
  title: Domain feature computation framework
  statement: The software shall provide a shared feature-computation framework that accepts normalized records and emits feature values with provenance, coverage, and confidence inputs.
  status: accepted
  derives_from:
  - SyR-012
  - SyR-014
  allocated_to_design:
  - DDS-004
  verification_method: software_specification_review
- id: SwR-012
  title: Domain A feature service
  statement: The software shall compute MVP-relevant Domain A features for information-space dynamics including volume, tone, topic, and source-context metrics.
  status: accepted
  derives_from:
  - SyR-012
  allocated_to_design:
  - DDS-004
  verification_method: software_specification_review
- id: SwR-013
  title: Domain B feature service
  statement: The software shall compute MVP-relevant Domain B features for event dynamics including conflict, protest, violence, and disaster-related indicators.
  status: accepted
  derives_from:
  - SyR-012
  allocated_to_design:
  - DDS-004
  verification_method: software_specification_review
- id: SwR-014
  title: Domain D feature service
  statement: The software shall compute MVP-relevant Domain D features for economic and structural dynamics including trade, energy, macro, and food-related indicators.
  status: accepted
  derives_from:
  - SyR-012
  allocated_to_design:
  - DDS-004
  verification_method: software_specification_review
- id: SwR-015
  title: Selective Domain C and E feature hooks
  statement: The software shall provide feature-computation hooks for selective Domain C and Domain E processing without making them mandatory in the MVP baseline.
  status: accepted
  derives_from:
  - SyR-007
  - SyR-017
  allocated_to_design:
  - DDS-004
  verification_method: software_specification_review
- id: SwR-016
  title: Coverage and confidence input computation
  statement: The software shall compute feature-level or batch-level coverage, freshness, and confidence inputs needed by downstream status logic.
  status: accepted
  derives_from:
  - SyR-014
  allocated_to_design:
  - DDS-004
  - DDS-005
  verification_method: software_specification_review
- id: SwR-017
  title: Relative baseline computation
  statement: The software shall compute relative country baselines using configured historical windows for downstream anomaly assessment.
  status: accepted
  derives_from:
  - SyR-013
  allocated_to_design:
  - DDS-005
  verification_method: software_specification_review
- id: SwR-018
  title: Combined 30 90 365 baseline support
  statement: The software shall support combined 30-day, 90-day, and 365-day reference windows as governed baseline inputs.
  status: accepted
  derives_from:
  - SyR-013
  allocated_to_design:
  - DDS-005
  verification_method: software_specification_review
- id: SwR-019
  title: Configurable current-window support
  statement: The software shall support governed current windows including a 7-day default and additional review windows for detailed analysis.
  status: accepted
  derives_from:
  - SyR-013
  allocated_to_design:
  - DDS-005
  verification_method: software_specification_review
- id: SwR-020
  title: Data sufficiency evaluator
  statement: The software shall evaluate data sufficiency before status computation and produce explicit insufficiency outcomes for inadequate inputs.
  status: accepted
  derives_from:
  - SyR-014
  allocated_to_design:
  - DDS-005
  - DDS-006
  verification_method: software_specification_review
- id: SwR-021
  title: Domain status rule engine
  statement: The software shall derive domain status values D0 through D5 from domain features, baseline comparisons, and data sufficiency results.
  status: accepted
  derives_from:
  - SyR-015
  allocated_to_design:
  - DDS-006
  verification_method: software_specification_review
- id: SwR-022
  title: Domain status explanation payload
  statement: The software shall emit drivers, uncertainty indicators, and rule references together with every domain status result.
  status: accepted
  derives_from:
  - SyR-015
  allocated_to_design:
  - DDS-006
  verification_method: software_specification_review
- id: SwR-023
  title: Multi-domain status rule engine
  statement: The software shall derive multi-domain status values S0 through S6 from active domain states using governed rule logic.
  status: accepted
  derives_from:
  - SyR-016
  allocated_to_design:
  - DDS-006
  verification_method: software_specification_review
- id: SwR-024
  title: Selective C and E inclusion gate
  statement: The software shall gate status-relevant use of domains C and E based on configured quality and interpretation sufficiency criteria.
  status: accepted
  derives_from:
  - SyR-017
  allocated_to_design:
  - DDS-006
  verification_method: software_specification_review
- id: SwR-025
  title: Snapshot schema
  statement: The software shall persist snapshots containing run identity, country-set identity, active domains, rule versions, source state, and resulting analytical outputs.
  status: accepted
  derives_from:
  - SyR-018
  allocated_to_design:
  - DDS-007
  verification_method: software_specification_review
- id: SwR-026
  title: Snapshot creation service
  statement: The software shall create a versioned snapshot after every successful or partial-success daily run.
  status: accepted
  derives_from:
  - SyR-009
  - SyR-018
  allocated_to_design:
  - DDS-007
  - DDS-012
  verification_method: software_specification_review
- id: SwR-027
  title: End-to-end lineage identifiers
  statement: The software shall preserve stable lineage identifiers linking source catalog entries, raw records, normalized records, features, status results, snapshots, and reports.
  status: accepted
  derives_from:
  - SyR-019
  allocated_to_design:
  - DDS-007
  verification_method: software_specification_review
- id: SwR-028
  title: Daily global snapshot generator
  statement: The software shall generate a daily global snapshot report in Markdown and JSON after successful or partial-success runs.
  status: accepted
  derives_from:
  - SyR-025
  allocated_to_design:
  - DDS-008
  verification_method: software_specification_review
- id: SwR-029
  title: Country report generator
  statement: The software shall generate manual country profile reports with status, drivers, counter-indicators, coverage, uncertainty, and linked event context.
  status: accepted
  derives_from:
  - SyR-021
  - SyR-025
  allocated_to_design:
  - DDS-008
  verification_method: software_specification_review
- id: SwR-030
  title: Domain and coverage report generators
  statement: The software shall generate manual domain, event, and coverage reports in governed export formats including IDs and source-state context.
  status: accepted
  derives_from:
  - SyR-023
  - SyR-025
  allocated_to_design:
  - DDS-008
  verification_method: software_specification_review
- id: SwR-031
  title: Export payload policy enforcement
  statement: The software shall apply export policy checks so that report payloads respect governance and misuse constraints before release.
  status: accepted
  derives_from:
  - SyR-027
  - SyR-028
  allocated_to_design:
  - DDS-008
  - DDS-011
  verification_method: software_specification_review
- id: SwR-032
  title: World anomaly map read model
  statement: The software shall provide a query-side read model for the world anomaly map including country status, active domains, baseline mode, and drill-down target data that resolve only to available country profile views in the generated GUI bundle.
  status: accepted
  derives_from:
  - SyR-020
  allocated_to_design:
  - DDS-009
  verification_method: software_test
- id: SwR-033
  title: Country profile read model
  statement: The software shall provide a read model for the country profile view including multi-domain status, domain states, per-domain yearly trends (separate series per domain to preserve scale comparability), combined yearly trends (legacy), drivers, and linked events.
  status: accepted
  derives_from:
  - SyR-021
  allocated_to_design:
  - DDS-009
  verification_method: software_specification_review
- id: SwR-034
  title: Domain detail read models
  statement: The software shall provide read models for domain detail views including time series, baseline comparison, feature values, and source context.
  status: accepted
  derives_from:
  - SyR-022
  allocated_to_design:
  - DDS-009
  verification_method: software_specification_review
- id: SwR-035
  title: Source and coverage read model
  statement: The software shall provide a read model exposing source status, history horizon, freshness, confidence, and failed-source information.
  status: accepted
  derives_from:
  - SyR-023
  allocated_to_design:
  - DDS-009
  verification_method: software_specification_review
- id: SwR-036
  title: Annotation persistence model
  statement: The software shall persist analyst annotations with scope, type, author, free text, tags, review state, and linked analytical objects.
  status: accepted
  derives_from:
  - SyR-024
  allocated_to_design:
  - DDS-010
  verification_method: software_specification_review
- id: SwR-037
  title: Annotation non-overwrite policy
  statement: The software shall store analyst annotations alongside generated system status without overwriting the generated status values.
  status: accepted
  derives_from:
  - SyR-024
  allocated_to_design:
  - DDS-010
  verification_method: software_specification_review
- id: SwR-038
  title: Validation case schema
  statement: The software shall persist validation cases with case identity, country, time range, expected domains, expected pattern, reference sources, and validation metrics.
  status: accepted
  derives_from:
  - SyR-026
  allocated_to_design:
  - DDS-010
  verification_method: software_specification_review
- id: SwR-039
  title: Backtest comparison service
  statement: The software shall support comparison of expected versus observed domain patterns for curated validation cases.
  status: accepted
  derives_from:
  - SyR-026
  allocated_to_design:
  - DDS-010
  verification_method: software_specification_review
- id: SwR-040
  title: Role model persistence and enforcement hooks
  statement: The software shall represent the MVP role model for Admin/Developer and Analyst and expose authorization hooks for controlled operations.
  status: accepted
  derives_from:
  - SyR-029
  allocated_to_design:
  - DDS-011
  verification_method: software_specification_review
- id: SwR-041
  title: Source governance metadata checks
  statement: The software shall validate required governance metadata for configured sources before those sources are treated as active for governed runs or exports.
  status: accepted
  derives_from:
  - SyR-027
  allocated_to_design:
  - DDS-011
  verification_method: software_specification_review
- id: SwR-042
  title: Misuse-boundary function guards
  statement: The software shall prevent software pathways that would expose targeting, operational recommendation, or disinformation-optimizing functionality within the governed MVP baseline.
  status: accepted
  derives_from:
  - SyR-028
  allocated_to_design:
  - DDS-011
  verification_method: software_specification_review
- id: SwR-043
  title: Daily run orchestrator
  statement: The software shall orchestrate daily runs across source fetch, normalization, feature computation, status derivation, snapshot creation, and report generation.
  status: accepted
  derives_from:
  - SyR-009
  allocated_to_design:
  - DDS-012
  verification_method: software_specification_review
- id: SwR-044
  title: Partial-success run state model
  statement: The software shall persist explicit run states including partial_success together with failed-source diagnostics and downstream visibility flags.
  status: accepted
  derives_from:
  - SyR-010
  allocated_to_design:
  - DDS-012
  verification_method: software_specification_review
- id: SwR-045
  title: Reprocessing workflow
  statement: The software shall support controlled reprocessing using versioned rules, mappings, and configuration tables so that outputs from different versions can be compared.
  status: accepted
  derives_from:
  - SyR-030
  allocated_to_design:
  - DDS-012
  verification_method: software_specification_review
- id: SwR-046
  title: Country-centric multi-domain assessment output contract
  statement: The software shall produce country-centric multi-domain assessment artifacts that explicitly separate and expose domains A, B, C, D, and E for structured situation understanding.
  status: accepted
  derives_from:
  - SyR-001
  - SyR-002
  allocated_to_design:
  - DDS-009
  - DDS-010
  verification_method: software_specification_review
- id: SwR-047
  title: Non-deterministic and anti-naive-fusion guardrails
  statement: The software shall prevent deterministic event-prediction outputs and shall prevent naive additive cross-domain A-E fusion-score pathways in the governed MVP baseline.
  status: accepted
  derives_from:
  - SyR-003
  allocated_to_design:
  - DDS-004
  - DDS-011
  verification_method: software_specification_review
- id: SwR-048
  title: Relative-baseline anomaly evaluation
  statement: The software shall evaluate signal abnormality relative to historical, country-specific, domain-specific, and source-specific baselines, not by absolute raw magnitude alone.
  status: accepted
  derives_from:
  - SyR-001
  allocated_to_design:
  - DDS-004
  verification_method: software_specification_review
- id: SwR-049
  title: Historical data foundation horizon policy
  statement: The software shall maintain a governed historical data foundation with a target horizon of at least three years for core sources where available and shall explicitly record shorter-horizon constraints per source.
  status: accepted
  derives_from:
  - SyR-008
  allocated_to_design:
  - DDS-001
  - DDS-003
  verification_method: software_specification_review
- id: SwR-050
  title: Daily incremental run and snapshot manifest contract
  statement: The software shall execute daily incremental runs that fetch, normalize, persist, and snapshot new data and shall emit run and snapshot manifests for reproducibility.
  status: accepted
  derives_from:
  - SyR-008
  - SyR-009
  allocated_to_design:
  - DDS-012
  verification_method: software_specification_review
- id: SwR-051
  title: Layered data-state separation
  statement: The software shall preserve explicit layer separation across raw data, normalized data, features, status or score outputs, and report or export artifacts.
  status: accepted
  derives_from:
  - SyR-008
  - SyR-019
  allocated_to_design:
  - DDS-003
  - DDS-009
  verification_method: software_specification_review
- id: SwR-052
  title: Frankfurter ECB exchange rate adapter
  statement: The software shall provide a source adapter for ECB reference exchange rates via the Frankfurter API (api.frankfurter.dev) that maps ISO-3 country codes to currencies, fetches latest USD-based rates in a single API call, includes retry with exponential backoff, and degrades gracefully on network or API failures.
  status: accepted
  derives_from:
  - SyR-007
  - SyR-010
  allocated_to_design:
  - DDS-002
  verification_method: unit_test
- id: SwR-053
  title: Voidly internet censorship score adapter
  statement: The software shall provide a source adapter for internet censorship scores via the Voidly Atlas API (api.voidly.ai) that fetches country-level censorship scores with confidence and sample counts, maps ISO-2 response codes to ISO-3, filters to requested countries, includes retry with exponential backoff, and degrades gracefully on network or API failures.
  status: accepted
  derives_from:
  - SyR-007
  - SyR-010
  - SyR-017
  allocated_to_design:
  - DDS-002
  verification_method: unit_test
- id: SwR-054
  title: HDX INFORM Risk Index adapter
  statement: The software shall provide a source adapter for the INFORM Risk Index via HDX CSV download (data.humdata.org) that parses country-level humanitarian risk indicators including the INFORM composite score and sub-dimensions, filters to target countries and key indicators, includes retry with exponential backoff, and degrades gracefully on network or parse failures.
  status: accepted
  derives_from:
  - SyR-007
  - SyR-010
  - SyR-017
  allocated_to_design:
  - DDS-002
  verification_method: unit_test
- id: SwR-055
  title: Parquet archive writer
  statement: The software shall write all normalized records to Hive-partitioned Parquet files (partitioned by source_id, year, month) after each pipeline run, using pyarrow, with a schema containing record_id, source_id, country_id, domain, signal_key, value, timestamp_utc, ingestion_utc, run_id, mapping_id, freshness_hours, and quality_flag.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-008
  verification_method: unit_test
  allocated_to: DDS-002
- id: SwR-056
  title: Archive writer pipeline hook
  statement: The software shall invoke the Parquet archive writer automatically after normalization in the live runtime pipeline, ensuring no normalized record is lost regardless of the SQLite operational retention window.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-009
  verification_method: unit_test
  allocated_to: DDS-002
- id: SwR-057
  title: Country registry with canonical entity resolution
  statement: The software shall maintain a machine-readable country registry (Parquet and YAML) containing canonical ISO-3 identifiers, name variants, source-specific code mappings (GDELT, World Bank, UNHCR, UCDP), UN region/subregion, income group, and active SIASA domains, with validation functions ensuring all active countries are covered.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-006
  verification_method: unit_test
  allocated_to: DDS-002
- id: SwR-058
  title: Signal registry with aggregation metadata
  statement: The software shall maintain a machine-readable signal registry (Parquet and YAML) containing signal_key, domain, source_id, description, unit, value range, native granularity, aggregation method (sum/mean/max/last), encoding hint, and semantic direction metadata for all active signal keys.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-052
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-059
  title: Dual-timestamp schema for temporal period metadata
  statement: The software shall extend NormalizedRecord and the Parquet archive schema with period_start (ISO UTC string), period_end (ISO UTC string), and granularity (enum-like string — hourly, daily, weekly, monthly, quarterly, yearly) fields. When adapters supply native temporal period boundaries, the normalization service shall propagate them into the archive. Fields default to empty string when not provided.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-060
  title: DuckDB analytical query engine over Parquet archive
  statement: The software shall provide an ArchiveQueryEngine backed by DuckDB that reads Hive-partitioned Parquet archive files and supports time-window queries, country/domain/signal filtering, aggregations (count, mean, sum, min, max), and returns pyarrow.Table output for ML pipeline compatibility.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-061
  title: DVC data versioning and pipeline definition
  statement: The software shall use DVC for data versioning with a dvc.yaml pipeline defining four stages (ingest, archive, features, training) with correct dependency chains, and data/.gitignore excluding DVC-tracked directories from Git.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-062
  title: Daily alignment pipeline with registry-driven aggregation
  statement: The software shall provide a DailyAligner that aggregates all archive records to daily canonical resolution using signal-registry aggregation rules (SUM for event counts, MEAN for scores, MAX for severity levels, LAST for yearly structural data with forward-fill), and detects temporal gaps between data points.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-052
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-063
  title: Multi-resolution feature builder with Fast/Slow/Structural layers
  statement: The software shall provide a MultiResolutionBuilder that decomposes daily-aligned data into three layers — Fast (daily signals), Slow (rolling-window aggregates with 7d/30d mean), and Structural (yearly base values) — returning typed pyarrow Tables for downstream ML pipeline consumption.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-052
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-064
  title: Point-in-time join engine with anti-leakage and staleness limits
  statement: The software shall provide a PointInTimeJoiner that assembles features at specific query dates using only past observations, enforces configurable staleness limits, and marks stale or absent values as NaN to prevent look-ahead bias in ML training data.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-065
  title: Versioned training-set builder with temporal split and normalization
  statement: The software shall provide a TrainingSetBuilder that generates versioned ML-ready datasets with temporal train/val/test splits (no random shuffling), signal-key pivoting, z-score normalization with saved parameters, and provenance metadata.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-066
  title: PyTorch time-series dataset with configurable window and zero-copy Arrow
  statement: The software shall provide a SIASATimeSeriesDataset (torch.utils.data.Dataset subclass) that loads time-series windows from Arrow tables with configurable lookback and prediction horizon, supports country and feature filtering, returns (input, target) tensor pairs of correct shape, and provides a collate function for variable-length batch assembly.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-067
  title: HuggingFace Datasets export with dataset card and schema validation
  statement: The software shall provide an HFExporter that converts SIASA training Parquet files to HuggingFace Dataset format with automatic dataset card generation, schema preservation, and optional Hub push capability.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-068
  title: ML encoding utilities for categorical SIASA features
  statement: The software shall provide encoding utilities that convert categorical SIASA features (country_id, domain, event_type, quality_flag) into ML-ready numeric representations including one-hot encoding, ordinal encoding, and embedding-dimension lookup tables.
  status: accepted
  derives_from:
  - SyR-051
  - SyR-053
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-069
  title: Pre-cleanup archive hook for SQLite retention policy
  statement: The software shall provide a RetentionArchiveHook that guarantees all records are archived to Parquet before SQLite retention cleanup deletes them, with verification that no data is lost during the retention cycle.
  status: accepted
  derives_from:
  - SyR-051
  verification_method: unit_test
  allocated_to: DDS-002

- id: SwR-070
  title: Archive health monitoring with per-source record counts and gap detection
  statement: The software shall provide an ArchiveHealthMonitor that reports record counts per source, domain, and year, detects data gaps, tracks storage size, and produces a structured health report suitable for dashboard rendering.
  status: accepted
  derives_from:
  - SyR-051
  verification_method: unit_test
  allocated_to: DDS-002
