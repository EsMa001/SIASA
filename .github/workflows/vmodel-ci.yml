name: vmodel-ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run smoke tests
        run: pytest tests -q
      - name: Enforce release gate (fail on no_go)
        run: PYTHONPATH=src python scripts/ci_release_gate_check.py
      - name: Enforce stakeholder functional closure focus cluster
        run: PYTHONPATH=src python scripts/ci_stakeholder_closure_check.py
      - name: Build release evidence pack
        run: PYTHONPATH=src python scripts/build_release_evidence_pack.py --output-dir build/release_evidence/latest
      - name: Run release failure drill (negative scenarios must fail gates)
        run: PYTHONPATH=src python scripts/release_failure_drill_check.py
