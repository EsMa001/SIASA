name: vmodel-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_probe:
        description: "Run governed live runtime probe job (network-dependent)"
        type: boolean
        default: false

jobs:
  hermetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run smoke tests
        shell: bash
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p build
          pytest tests -q --maxfail=1 --durations=20 --junitxml=build/pytest-smoke.xml 2>&1 | tee build/pytest-smoke.log
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            build/pytest-smoke.xml
            build/pytest-smoke.log
          if-no-files-found: warn
      - name: Enforce release gate (fail on no_go)
        run: PYTHONPATH=src python scripts/ci_release_gate_check.py
      - name: Enforce stakeholder functional closure focus cluster
        run: PYTHONPATH=src python scripts/ci_stakeholder_closure_check.py
      - name: Enforce stakeholder E2E flow coverage
        run: PYTHONPATH=src python scripts/ci_stakeholder_e2e_flow_coverage_check.py
      - name: Enforce stakeholder E2E UI smoke coverage
        run: PYTHONPATH=src python scripts/ci_stakeholder_e2e_ui_smoke_check.py
      - name: Enforce stakeholder browser E2E acceptance
        run: PYTHONPATH=src python scripts/ci_stakeholder_browser_e2e_acceptance_check.py
      - name: Enforce stakeholder browser interaction depth
        run: PYTHONPATH=src python scripts/ci_stakeholder_browser_interaction_depth_check.py
      - name: Enforce stakeholder browser failure-mode resilience
        run: PYTHONPATH=src python scripts/ci_stakeholder_browser_failure_resilience_check.py
      - name: Enforce stale-remediation actionability
        run: PYTHONPATH=src python scripts/ci_stale_remediation_actionability_check.py
      - name: Build release evidence pack
        run: PYTHONPATH=src python scripts/build_release_evidence_pack.py --output-dir build/release_evidence/latest
      - name: Run release failure drill (negative scenarios must fail gates)
        run: PYTHONPATH=src python scripts/release_failure_drill_check.py

  live-probe-governed-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run governed live probe bundle build (explicit degraded mode)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          PYTHONPATH=src python scripts/build_operational_latest_bundle.py \
            --run-id RUN-CI-LIVE-PROBE-${{ github.run_number }} \
            --pilot-set representative \
            --artifacts-dir build/run_artifacts/latest \
            --gui-output-dir build/local_gui/latest \
            --history-db build/run_history/latest_runs.sqlite \
            --allow-partial-success \
            --allow-failed-sources 2>&1 | tee build/live-probe.log
      - name: Verify generated latest bundle in degraded-aware mode
        run: |
          PYTHONPATH=src python scripts/verify_latest_bundle.py \
            --artifacts-dir build/run_artifacts/latest \
            --allow-partial-success \
            --allow-failed-sources
      - name: Build live-probe evidence digest readmodel
        env:
          LIVE_PROBE_POLICY_FILE: vmodel/project/live_probe_policy_profiles.yaml
          LIVE_PROBE_POLICY_PROFILE: standard
        run: |
          PYTHONPATH=src python scripts/build_live_probe_evidence_digest.py \
            --artifacts-dir build/run_artifacts/latest
      - name: Enforce live-probe digest policy gate
        run: |
          PYTHONPATH=src python scripts/ci_live_probe_digest_gate_check.py \
            --digest-path build/run_artifacts/latest/readmodels/live_probe_evidence_digest.json \
            --policy-file vmodel/project/live_probe_policy_profiles.yaml \
            --policy-profile standard \
            --output build/run_artifacts/latest/readmodels/live_probe_policy_gate_result.json
      - name: Upload live probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-probe-diagnostics
          path: |
            build/live-probe.log
            build/run_artifacts/latest
            build/local_gui/latest
            build/run_artifacts/latest/readmodels/live_probe_evidence_digest.json
            build/run_artifacts/latest/readmodels/live_probe_policy_gate_result.json
          if-no-files-found: warn
