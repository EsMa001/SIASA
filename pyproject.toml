[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siasa"
version = "0.1.0"
description = "SIASA - V-Model-light / requirements-as-code scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
siasa-local-gui = "siasa.gui.local_app:main"
siasa-live-runtime = "siasa.runs.live_runtime:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
